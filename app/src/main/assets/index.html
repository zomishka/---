s2:()=>[{bg:'street',t:1,text:'Во дворе напротив курили чужие пацаны. Они смотрели на тебя в упор и не отводили взгляд. Ты вспомнил, чьи они, и почувствовал, как напряглись плечи у ребят рядом.',cast:[npc(500,340,'#3a3a5a',{d:-1}),npc(580,350,'#5a3a3a',{d:-1}),hr(220,345)]}],
s3:()=>[{bg:'street',t:0,text:'Утром у подъезда тебя догнал Сашка — одноклассник, с которым вы раньше воровали яблоки. Он оглядывался и говорил быстро, как будто боялся передумать.',cast:[hr(260,345),npc(420,345,'#4a8a5a',{d:-1})]}],
s12:()=>[{bg:'home',t:1,text:'Дом напротив. Второй этаж, занавески задёрнуты. За дверью слышно: кто-то ходит и притворяется, что никого нет. Здесь живёт тот, кто не платит. Твой выход.',cast:[hr(300,345)]}],
s17:()=>[{bg:'home',t:2,text:'Мать сидела на кухне, перед ней на клеёнке лежало то, что она нашла в кармане твоей куртки. Её руки дрожали. Она долго молчала, и от этой тишины было хуже, чем от крика.',cast:[npc(520,345,'#a65b2a',{d:-1}),hr(260,345)]}],
s13:()=>[{bg:'station',t:1,text:'В вокзальном буфете к тебе подсел парень в чужой куртке. Ты уже знал, чей он. Он положил руки на стол, чтобы ты видел: не за этим пришёл.',cast:[hr(280,345),npc(460,345,'#777',{d:-1})]}],
s4:()=>[{bg:'room',t:3,text:'В штабе было накурено так, что щипало глаза. Все молчали. Спор шёл о рынке: «Жилку» хотят потеснить, а вместе с ней ещё кого-то. Назревало то, чего не отменить словами.',cast:[ldr(520,345,{d:-1}),npc(380,350,'#555'),hr(250,345)]}],
s5:()=>[{bg:'office',t:1,text:'В отделении пахло хлоркой и мокрыми тряпками. За решёткой сидел Сашка, бледный, с опущенной головой. Дежурный листал бумаги и делал вид, что тебя нет.',cast:[hr(260,345),npc(540,345,'#4a6fa5',{d:-1})]}],
s6:()=>[{bg:'room',t:3,text:'Кто-то из своих сдал сходняк. Менты знали время и место. В штабе повисла тишина: каждый смотрел на соседа и искал в нём чужого.',cast:[ldr(520,345,{d:-1}),npc(380,350,'#555'),npc(630,350,'#444',{d:-1}),hr(250,345)]}],
s14:()=>[{bg:'market',t:1,text:'На рынке пахло хлебом и сыростью. Коммерс окликнул тебя от прилавка и поманил к себе пальцем. «Парень видный, — сказал он. — Люди тебя знают».',cast:[hr(260,345),npc(520,345,'#20b2aa',{d:-1})]}],
s18:()=>[{bg:'street',t:3,text:'У ДК Химиков играла музыка. Девушка стояла чуть в стороне, будто не принадлежала ни одному двору. Ты поймал её взгляд и понял: сейчас можно вести себя как человек, а не как «свой».',cast:[hr(280,345),npc(450,345,'#c06a8a',{d:-1})]}],
s7:()=>[{bg:'room',t:3,text:'Сходняк. Прокуренный подвал, лавки вдоль стен, старшие со всех сторон. Каждый ждёт, что скажешь ты. От этого слова зависит, потечёт ли кровь за рынок.',cast:[ldr(520,345,{d:-1}),npc(380,350,'#666'),npc(640,350,'#555',{d:-1}),hr(240,345)]}],
s8:()=>[{bg:'grave',t:2,text:'Холодным утром похоронили парня из соседнего двора. Мать плакала у ограды, друзья молчали. В толпе шепнули: «Свои постарались». Ты стоял и думал, чья это вина — и твоя ли.',cast:[hr(300,345),npc(480,345,'#444',{d:-1})]}],
s9:()=>[{bg:'office',t:1,text:'Капитан Рамазанов вызвал тебя сам. Положил на стол конверт и посмотрел так, будто уже всё решил. «Свидетелей у нас много, — сказал он. — Но нужен тот, кто знает всех».',cast:[hr(260,345),npc(540,345,'#4a6fa5',{d:-1})]}],
s19:()=>[{bg:'room',t:3,text:'Старший сидел у окна и смотрел во двор. «Я своё отходил, — сказал он. — Пусть теперь другие». Он обернулся: «Участок надо передать. Кому?»',cast:[ldr(540,345,{d:-1}),hr(260,345)]}],
s15:()=>[{bg:'street',t:3,text:'Ночью во двор въехали машины, засвистели свистки. Свет фар резал темноту. Кто-то побежал, кто-то встал у стены. Нужно было решать за секунду.',cast:[hr(260,345),npc(480,345,'#4a6fa5',{d:-1}),npc(580,345,'#4a6fa5',{d:-1})]}],
s20:()=>[{bg:'field',t:3,text:'Пустырь за гаражами. Ветер гонял пакеты. Он стоял один, руки в карманах. Авторитет соседнего района не любил долгих слов: «Слышал о тебе. Посмотрим, кто ты есть».',cast:[hr(260,345),npc(520,345,'#8b0000',{d:-1})]}],
s16:()=>[{bg:'room',t:3,text:'В штабе произошёл раскол. Одни кричали, что хватит терпеть и пора показать зубы. Другие — что дорого мы заплатим за такую гордость. Взгляды сходились на тебе.',cast:[ldr(520,345,{d:-1}),npc(380,350,'#555'),npc(640,350,'#777',{d:-1}),hr(250,345)]}],
s10:()=>[{bg:'river',t:2,text:'Вечером старшие говорили вполголоса: через несколько дней на Стрелке соберутся все районы. Все — значит и те, с кем у тебя счёты, и те, с кем ты сидел за одной партой.',cast:[ldr(520,345,{d:-1}),hr(260,345)]}],
s11:()=>[{bg:'home',t:3,text:'Ночь перед Стрелкой. Ты ворочался, и перед глазами вставал двор: качели, лавка, чужие кулаки в ту осень. Кем ты был — и кем стал? И кем будешь, когда рассветёт?',cast:[hr(400,345)]}],
s21:()=>[{bg:'river',t:2,text:'Рассвет над Казанкой. На набережной уже стояли люди — сотни, молча, плечом к плечу. Тишина была такая, что слышно воду. Это и была Стрелка.',cast:[hr(300,345),ldr(480,345,{d:-1})]}]};
